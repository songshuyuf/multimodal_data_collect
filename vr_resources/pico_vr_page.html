<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR 同步播放</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    #video-wrap {
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      z-index: 10;
    }
    #config {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="status">等待连接 PC...</div>
  <div id="config"></div>
  <div id="video-wrap">
    <video id="v" playsinline></video>
  </div>

  <script>
    (function() {
      // ========== 配置：请修改为你的 PC IP 和端口 ==========
      // 方式1：直接写死（把下面的 192.168.1.100 改成你 PC 的局域网 IP）
      // 运行 test_vr_unit.py 时终端会打印 PICO 连接地址，复制其中的 IP 即可
      const PC_IP = "192.168.1.100";
      const PC_PORT = 8765;

      // 方式2：从 URL 参数读取，例如 ?pc=192.168.1.100&port=8765
      const params = new URLSearchParams(location.search);
      const pc = params.get("pc") || PC_IP;
      const port = params.get("port") || String(PC_PORT);
      const stateUrl = "http://" + pc + ":" + port + "/state";

      // 视频路径：优先用 URL 参数 video=xxx，否则用相对路径
      const videoSrc = params.get("video") || "video.mp4";

      const video = document.getElementById("v");
      const statusEl = document.getElementById("status");
      const configEl = document.getElementById("config");

      configEl.textContent = "PC: " + pc + ":" + port + " | 视频: " + videoSrc;

      let lastCmd = "";
      let pollTimer = null;

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function applyCmd(cmd) {
        if (cmd === lastCmd) return;
        lastCmd = cmd;

        if (cmd === "play") {
          video.play().catch(function(e) {
            setStatus("播放失败: " + e.message);
          });
          setStatus("播放中");
        } else if (cmd === "pause") {
          video.pause();
          setStatus("已暂停");
        } else if (cmd === "stop") {
          video.pause();
          video.currentTime = 0;
          setStatus("已停止");
        } else {
          setStatus("等待命令 (idle)");
        }
      }

      function poll() {
        fetch(stateUrl, { mode: "cors" })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            applyCmd(data.cmd || "idle");
          })
          .catch(function(err) {
            setStatus("连接 PC 失败: " + err.message);
          });
      }

      // 设置视频源并开始轮询
      video.src = videoSrc;
      video.load();
      setStatus("已加载视频，轮询 PC...");
      poll();
      pollTimer = setInterval(poll, 500);

      // 视频结束自动切回 idle 显示
      video.addEventListener("ended", function() {
        setStatus("播放完成");
      });
    })();
  </script>
</body>
</html>
